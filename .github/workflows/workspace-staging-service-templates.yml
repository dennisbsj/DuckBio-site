name: Validate offline Workspace staging systemd and Caddy syntax

on:
  pull_request:
    paths:
      - 'workspace-server/staging-*.mjs'
      - 'workspace-server/tests/staging-service-plan.test.mjs'
      - 'workspace-server/tests/staging-proxy-https-live.mjs'
      - 'workspace-server/tests/staging-seven-proxy-plan.test.mjs'
      - 'workspace-server/tests/staging-six-native-services.test.mjs'
      - 'workspace-server/six-app-source-qa-lock.json'
      - 'workspace-server/private-ui/**'
      - 'workspace-server/package.json'
      - '.github/workflows/workspace-staging-service-templates.yml'
  push:
    branches: [main]
    paths:
      - 'workspace-server/staging-*.mjs'
      - 'workspace-server/tests/staging-service-plan.test.mjs'
      - 'workspace-server/tests/staging-proxy-https-live.mjs'
      - 'workspace-server/tests/staging-seven-proxy-plan.test.mjs'
      - 'workspace-server/tests/staging-six-native-services.test.mjs'
      - 'workspace-server/six-app-source-qa-lock.json'
      - 'workspace-server/private-ui/**'
      - 'workspace-server/package.json'
      - '.github/workflows/workspace-staging-service-templates.yml'

permissions:
  contents: read

jobs:
  syntax-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate only disposable private test configuration and templates
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          chmod 700 "$root"
          echo "STAGING_QA_TMP=$root" >> "$GITHUB_ENV"
          cd workspace-server
          SHA="$(git rev-parse --verify HEAD)"
          node staging-generate-config.mjs \
            --base-domain duckbio.net \
            --private-root "$root" \
            --build-sha "$SHA" \
            --confirm-synthetic-only
          node staging-preflight.mjs --config "$root/workspace-staging.json"
          node staging-prepare-ui.mjs \
            --config "$root/workspace-staging.json" --confirm-first-install
          node staging-service-plan.mjs \
            --config "$root/workspace-staging.json" \
            --service-user duckbio-staging \
            --listen-port 3307 \
            --node-binary "$(command -v node)" \
            --confirm-plan-only
      - name: Validate systemd unit with native Ubuntu tool, without installing it
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd --system duckbio-staging
          sudo useradd --system --no-create-home --gid duckbio-staging duckbio-staging
          systemd-analyze verify \
            "$STAGING_QA_TMP/staging-service-plan/duckbio-workspace-staging.service"
      - name: Validate Caddyfile using Caddy 2.10.2 in a network-disabled disposable container
        shell: bash
        run: |
          set -euo pipefail
          file="$STAGING_QA_TMP/staging-service-plan/Caddyfile.workspace-staging"
          docker run --rm --network none --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$file:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy adapt \
            --config /etc/caddy/Caddyfile --adapter caddyfile --pretty \
            > "$RUNNER_TEMP/duckbio-staging-caddy-adapted.json"
          docker run --rm --network none --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$file:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
          node --input-type=module - "$RUNNER_TEMP/duckbio-staging-caddy-adapted.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const serialized=JSON.stringify(config);
          assert.ok(serialized.includes('staging-workspace.duckbio.net'));
          assert.ok(serialized.includes('127.0.0.1:3307'));
          for(const id of ['goflo','eel','methpipe','mantrain','duckman','limsman'])
            assert.ok(!serialized.includes('staging-'+id+'.duckbio.net'),
              'central proxy cannot accidentally include native app origins');
          NODE
      - name: Generate seven-origin candidate routing with only disposable private source data
        shell: bash
        run: |
          set -euo pipefail
          config_root="$STAGING_QA_TMP/seven-source-config"
          output_root="$STAGING_QA_TMP/seven-proxy-output"
          install -d -m 700 "$config_root" "$output_root"
          candidate="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("workspace-server/six-app-source-qa-lock.json","utf8")).central.sha)')"
          cd workspace-server
          node staging-generate-config.mjs \
            --base-domain duckbio.net \
            --private-root "$config_root" \
            --build-sha "$candidate" \
            --confirm-synthetic-only
          node staging-seven-proxy-plan.mjs \
            --config "$config_root/workspace-staging.json" \
            --private-output-root "$output_root" \
            --confirm-uninstalled-only
      - name: Parse and validate all seven Caddy host routes without network or installation
        shell: bash
        run: |
          set -euo pipefail
          file="$STAGING_QA_TMP/seven-proxy-output/seven-origin-proxy-plan/Caddyfile.seven-origin-staging"
          docker run --rm --network none --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$file:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy adapt \
            --config /etc/caddy/Caddyfile --adapter caddyfile --pretty \
            > "$RUNNER_TEMP/duckbio-seven-caddy-adapted.json"
          docker run --rm --network none --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$file:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy validate \
            --config /etc/caddy/Caddyfile --adapter caddyfile
          node --input-type=module - "$RUNNER_TEMP/duckbio-seven-caddy-adapted.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const parsed=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const serialized=JSON.stringify(parsed);
          const names=['workspace','goflo','eel','methpipe','mantrain','duckman','limsman'];
          for(let i=0;i<names.length;i++){
            assert.ok(serialized.includes('staging-'+names[i]+'.duckbio.net'),
              'expected staging host missing in Caddy config');
            assert.ok(serialized.includes('127.0.0.1:'+(3307+i)),
              'expected distinct loopback route missing');
          }
          assert.ok(!serialized.includes('0.0.0.0:'),
            'Caddy must not proxy a public native backend');
          NODE
      - name: Exercise actual Workspace behind Caddy via loopback TLS (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          qa="$(mktemp -d)"
          chmod 700 "$qa"
          container="duckbio-qa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pid=""
          cleanup() {
            rc="$?"
            if [[ "$rc" -ne 0 ]]; then
              echo 'Diagnostic: ephemeral loopback listeners'
              ss -lntp | grep -E ':(3307|18443|443)\\b' || true
              echo 'Diagnostic: synthetic Caddy startup'
              docker logs "$container" 2>&1 | tail -30 || true
              echo 'Diagnostic: synthetic Workspace process'
              tail -25 "$RUNNER_TEMP/duckbio-staging-node.log" 2>/dev/null || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            if [[ -n "$pid" ]]; then
              kill "$pid" >/dev/null 2>&1 || true
              wait "$pid" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$qa"
            rm -f "$RUNNER_TEMP/duckbio-staging-node.log"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -keyout "$qa/key.pem" -out "$qa/cert.pem" \
            -subj '/CN=staging-workspace.duckbio.net' \
            -addext 'subjectAltName=DNS:staging-workspace.duckbio.net' \
            >/dev/null 2>&1
          chmod 600 "$qa/key.pem" "$qa/cert.pem"
          node --input-type=module - \
            "$STAGING_QA_TMP/staging-service-plan/Caddyfile.workspace-staging" \
            "$qa/Caddyfile.qa" <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const template=readFileSync(process.argv[2],'utf8');
          const opening='staging-workspace.duckbio.net {\n';
          assert.equal(template.split(opening).length,2,
            'must test the actual reviewed, single Workspace site block');
          const site=template.replace(opening,opening+
            '  bind 127.0.0.1\n  tls /qa/cert.pem /qa/key.pem\n');
          const globalOptions=[
            '{','  admin off','  auto_https off','  https_port 18443','}',''
          ].join('\n');
          writeFileSync(process.argv[3],globalOptions+'\n'+site,{flag:'wx',mode:0o600});
          NODE
          # Certificate and listener are synthetic; no ACME, DNS or public ports.
          docker run --rm --network none --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$qa:/qa:ro" \
            caddy:2.10.2 caddy validate \
            --config /qa/Caddyfile.qa --adapter caddyfile
          cd workspace-server
          NODE_ENV=production PORT=3307 \
            SUITE_ENV_FILE="$STAGING_QA_TMP/workspace-staging.json" \
            node shared-auth/runtime.mjs \
            > "$RUNNER_TEMP/duckbio-staging-node.log" 2>&1 &
          pid="$!"
          docker run --detach --name "$container" --network host \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp --tmpfs /data --tmpfs /config \
            -v "$qa:/qa:ro" \
            caddy:2.10.2 caddy run \
            --config /qa/Caddyfile.qa --adapter caddyfile >/dev/null
          DUCKBIO_PROXY_TEST_CONFIG="$STAGING_QA_TMP/workspace-staging.json" \
            DUCKBIO_PROXY_TEST_CA="$qa/cert.pem" \
            DUCKBIO_PROXY_TEST_PORT=18443 \
            node --test tests/staging-proxy-https-live.mjs
          echo 'PASS real Caddy TLS and Workspace Node synthetic loopback integration (CI only)'
      - name: Verify all six native systemd templates with real Ubuntu systemd parser (not installed)
        shell: bash
        run: |
          set -euo pipefail
          # Six throwaway local service identities, only on the ephemeral runner.
          for id in goflo eel methpipe mantrain duckman limsman; do
            user="duckbio-stg-$id"
            sudo groupadd --system "$user"
            sudo useradd --system --no-create-home --gid "$user" "$user"
          done
          cd workspace-server
          DUCKBIO_VERIFY_NATIVE_SYSTEMD=1 \
            node --test tests/staging-six-native-services.test.mjs
      - name: Remove all synthetic plan files
        if: always()
        shell: bash
        run: |
          if [[ -n "$STAGING_QA_TMP" && -d "$STAGING_QA_TMP" ]]; then
            rm -rf -- "$STAGING_QA_TMP"
          fi
          rm -f "$RUNNER_TEMP/duckbio-staging-caddy-adapted.json"
          rm -f "$RUNNER_TEMP/duckbio-seven-caddy-adapted.json"
