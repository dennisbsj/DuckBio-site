<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c55"><meta name="description" content="Explore all six DuckBio apps in an interactive, screenshot-style preview of the central workspace."><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Workspace preview | DuckBio</title><script>try{document.documentElement.dataset.theme=localStorage.getItem("duckbio-theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script><link rel="stylesheet" href="assets/site.css?v=workspace-portal-20261031-1"><script src="assets/site.js?v=duckbio-night-20261029-2" defer></script><link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="assets/duckbio-favicon-v2.svg"><link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="assets/duckbio-favicon-v2-dark.svg"></head><body class="workspace-portal"><a class="skip" href="#main">Skip to content</a><header class="workspace-portal-header" aria-label="Workspace preview portal">
 <div class="workspace-portal-header-inner">
  <div class="workspace-portal-identity"><span class="workspace-portal-kicker">Separate application environment · Interactive preview</span><strong>DuckBio <span>Workspace</span></strong></div>
  <div class="workspace-portal-actions">
   <a class="workspace-portal-back" href="index.html" aria-label="Return to DuckBio marketing website">← Back to DuckBio website</a>
   <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to night mode" title="Switch to night mode" aria-pressed="false"><span class="theme-icon" data-theme-icon aria-hidden="true">☾</span></button>
  </div>
 </div>
</header><main id="main">
<section class="section soft workspace-preview-section"><div class="wrap workspace-preview-wrap">
 
 <div class="workspace-screenshot" aria-label="Interactive DuckBio app workspace preview">
   <iframe id="workspace-frame" src="launcher.html?v=workspace-day-night-20261031-1" title="Interactive Workspace preview: all six app descriptions, communication tools, account settings and permissions" loading="eager" scrolling="no"></iframe>
 </div>

</div></section>
</main><script>
(()=>{
 "use strict";
 const frame=document.getElementById("workspace-frame");
 if(!frame)return;
 // Keep the intrinsic full-height workspace visible: never force a 390px
 // fallback over CSS, or the footer will cover the bottom row of app cards.
 let contentHeight=0;
 function sizeFrame(){
  if(!contentHeight)return; // CSS reserves sufficient space before the child loads.
  const target=Math.ceil(Math.max(300,contentHeight+2));
  if(Math.abs(frame.getBoundingClientRect().height-target)>1){
   frame.style.height=target+"px";
  }
 }
 function measureChild(){
  // Same-origin direct measurement supplements postMessage on mobile browsers.
  try{
   const doc=frame.contentDocument;
   const shell=doc?.querySelector(".shell");
   const bar=doc?.querySelector(".bar");
   if(!shell||!bar)return;
   const measured=Math.ceil(Math.max(shell.getBoundingClientRect().bottom,
                                   bar.getBoundingClientRect().bottom)+2);
   if(measured>=200&&measured<=20000){contentHeight=measured;sizeFrame()}
  }catch(e){ /* postMessage remains the fallback */ }
 }
 window.addEventListener("message",event=>{
  if(event.source!==frame.contentWindow||event.origin!==window.location.origin)return;
  if(event.data?.type!=="duckbio-workspace-height")return;
  const proposed=Number(event.data.height);
  if(!Number.isFinite(proposed)||proposed<200||proposed>20000)return;
  contentHeight=Math.ceil(proposed);
  sizeFrame();
 });
 frame.addEventListener("load",()=>{measureChild();requestAnimationFrame(measureChild)});
 window.addEventListener("resize",()=>requestAnimationFrame(measureChild));
})();
</script></body></html>
