<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="t d">
<title id="t">CytoDuck</title><desc id="d">A white lab duck standing in front of a flow cytometer, a small coloured signal wave and a dot plot.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#051b36"/><stop offset="1" stop-color="#04506b"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#ffffff"/><stop offset=".65" stop-color="#e5f9ff"/><stop offset="1" stop-color="#9cdce9"/></linearGradient>
<linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ffbf2"/><stop offset=".5" stop-color="#1fcbd7"/><stop offset="1" stop-color="#087cae"/></linearGradient>
<linearGradient id="hardware" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#205b84"/><stop offset=".6" stop-color="#0d3358"/><stop offset="1" stop-color="#062138"/></linearGradient>
<clipPath id="round"><rect width="192" height="192" rx="32"/></clipPath>
</defs>
